<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMC Athletics | Pit Crew</title>
<meta name="description" content="Every Greer Middle College game, match and meet for the 2026-27 school year.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2300205b'/></svg>">
<style>
  :root {
    --paper:#F4F3EF; --navy:#00205b; --blue:#6495ed;
    --text:#2E3949; --dim:#6B7686; --line:#D9D7D0; --white:#fff;
    --athletics-teal:rgb(0,113,144);
    --athletics-aqua:rgb(188,228,229);
    --athletics-tan:rgb(194,174,147);
    --athletics-gold:rgb(253,191,104);
    /* swapped at runtime by setAccent(), one breaker for the whole page */
    --accent:#00205b; --accent-soft:rgba(0,32,91,0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; min-height: 100vh; padding: 40px 0;
    background: var(--paper); color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }
  main { width: min(90%, 700px); margin: 0 auto; }

  /* top band, cheapest signal of which section you are in */
  .band { height: 8px; background: var(--accent); margin-bottom: 26px; }

  .eyebrow {
    margin: 0 0 10px;
    font-size: 0.8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--accent);
  }

  h1 {
    margin: 0; color: var(--accent);
    font-size: clamp(3rem, 10vw, 5.5rem); line-height: 0.9;
    letter-spacing: -0.05em; text-transform: uppercase;
  }

  .divider { width: 60px; height: 5px; margin: 28px 0; background: var(--accent); }

  .updated { margin: 0 0 24px; font-size: 0.95rem; color: var(--dim); }
  .updated b { color: var(--navy); font-weight: 700; }

  /* season tabs, each flips the accent */
  .tabs {
    display: flex; border-bottom: 2px solid var(--line); margin-bottom: 28px;
  }
  .tab {
    flex: 1; padding: 12px 4px; margin-bottom: -2px;
    border: none; border-bottom: 4px solid transparent; background: transparent;
    color: var(--dim); font: bold 0.8rem Arial, sans-serif;
    text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer;
  }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }

  /* next-up feature, same tint treatment as the spec strip */
  .feature {
    padding: 20px; margin-bottom: 30px;
    background: var(--accent-soft); border-left: 4px solid var(--accent);
  }
  .feature .count { font-size: 2.6rem; font-weight: 700; line-height: 1; color: var(--accent); }
  .feature .count small {
    display: block; margin-top: 6px;
    font-size: 0.8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--dim);
  }
  .feature h2 {
    margin: 12px 0 6px; color: var(--navy);
    font-size: clamp(1.4rem, 4.5vw, 2rem); line-height: 1.25; letter-spacing: -0.02em;
  }
  .feature .fmeta { font-size: 0.9rem; color: var(--dim); line-height: 1.5; }

  /* filters */
  .filters { margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label {
    font-size: 0.8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim);
  }
  .field input, .field select {
    font: 1rem Arial, sans-serif; padding: 12px;
    border: 2px solid var(--line); background: var(--white); color: var(--text);
  }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    padding: 10px 16px;
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
    font: bold 0.8rem/1 Arial, sans-serif;
    text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--white); }

  .filter-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .result-count { font-size: 0.9rem; color: var(--dim); }
  .btn-clear {
    border: none; background: transparent; color: var(--accent);
    font: bold 0.9rem Arial, sans-serif;
    text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; padding: 8px 0;
  }

  /* one day heading, then a square-bullet list of its contests */
  .day {
    margin: 0 0 8px; padding-top: 18px;
    font-size: 0.8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent);
  }
  ul.games { margin: 0 0 10px; padding: 0; list-style: none; }
  ul.games li {
    padding: 12px 0 12px 18px; position: relative;
    border-bottom: 1px solid var(--line);
  }
  ul.games li::before {
    content: ""; position: absolute; left: 0; top: 18px;
    width: 7px; height: 7px; background: var(--accent);
  }
  .g-title { font-size: 1rem; font-weight: 700; line-height: 1.4; color: var(--navy); }
  .g-meta { margin-top: 2px; font-size: 0.9rem; line-height: 1.5; color: var(--dim); }
  .g-note { margin-top: 4px; font-size: 0.9rem; color: var(--dim); }

  .tag {
    display: inline-block; margin-left: 8px; padding: 2px 7px;
    border: 2px solid var(--accent); color: var(--accent);
    font-size: 0.7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; vertical-align: middle;
  }
  .tag.away { border-color: var(--dim); color: var(--dim); }

  .empty {
    padding: 20px;
    background: var(--accent-soft); border-left: 4px solid var(--accent);
    font-size: 0.95rem; color: var(--dim);
  }
  .empty strong { display: block; margin-bottom: 4px; color: var(--navy); }

  .footer {
    width: min(90%, 700px); margin: 44px auto 0; padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 0.9rem; line-height: 1.6; color: var(--dim);
  }

  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  @media (max-width: 500px) {
    .filter-actions { flex-direction: column; align-items: stretch; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<div class="band"></div>

<main>
  <p class="eyebrow" id="eyebrow">Greer Middle College &middot; 2026-27</p>
  <h1>GMC Athletics</h1>
  <div class="divider"></div>

  <p class="updated" id="updated">Last updated: <b id="updated-date">&mdash;</b></p>

  <div class="tabs" id="tabs" role="tablist" aria-label="Season"></div>

  <section class="feature" id="feature" aria-label="Next contest"></section>

  <form class="filters" aria-label="Filter the schedule" onsubmit="return false">
    <div class="field">
      <label for="f-search">Search</label>
      <input type="search" id="f-search" placeholder="Opponent, venue, anything">
    </div>
    <div class="field">
      <label for="f-sport">Sport</label>
      <select id="f-sport"><option value="">All sports</option></select>
    </div>

    <div class="chips" role="group" aria-label="Quick filters">
      <button type="button" class="chip" id="c-upcoming" aria-pressed="false">Upcoming only</button>
      <button type="button" class="chip" id="c-home" aria-pressed="false">Home</button>
      <button type="button" class="chip" id="c-away" aria-pressed="false">Away</button>
    </div>

    <div class="filter-actions">
      <span class="result-count" id="result-count" role="status">&mdash;</span>
      <button type="button" class="btn-clear" id="btn-clear">Clear filters</button>
    </div>
  </form>

  <div id="results"></div>
</main>

<footer class="footer">
  <p>Built from the GMC 2026-27 athletics calendar. Some team levels and dates are best guesses from a month-grid calendar; confirm anything that matters with the coach.</p>
</footer>

<script>
(function () {
  "use strict";

  var DATA = (window.GMC_ATHLETICS && window.GMC_ATHLETICS.events) || [];

  /* ---- date helpers. Parse ISO by hand so a bare date is not read as UTC. ---- */
  function toDate(iso) {
    var p = String(iso).split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function today() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function fmtLong(iso) {
    return toDate(iso).toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    });
  }
  function fmtShort(iso) {
    return toDate(iso).toLocaleDateString(undefined, {
      weekday: "short", month: "short", day: "numeric"
    });
  }
  function localISO(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  // The team level is shown as part of the sport name, e.g. "Girls Basketball JV".
  function sportLabel(e) {
    return e.team ? e.sport + " " + e.team : e.sport;
  }

  /* ---- tiny DOM builder. Data goes in as textContent, never innerHTML. ---- */
  function el(tag, opts) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.text != null) node.textContent = opts.text;
    if (opts.cls) node.className = opts.cls;
    if (opts.attrs) Object.keys(opts.attrs).forEach(function (k) {
      node.setAttribute(k, opts.attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c) node.appendChild(c);
    }
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  /* ---- one accent per season, flipped like a breaker ---- */
  var SEASONS = [
    { key: "",       label: "All seasons", accent: "#00205b", soft: "rgba(0,32,91,0.08)" },
    { key: "Fall",   label: "Fall",        accent: "#007190", soft: "rgba(0,113,144,0.08)" },
    { key: "Winter", label: "Winter",      accent: "#1B4FA8", soft: "rgba(27,79,168,0.08)" },
    { key: "Spring", label: "Spring",      accent: "#0E6E66", soft: "rgba(14,110,102,0.08)" }
  ];
  function setAccent(color, soft) {
    document.documentElement.style.setProperty("--accent", color);
    document.documentElement.style.setProperty("--accent-soft", soft);
  }

  /* ---- which season each sport-level sits in, and how the seasons run ---- */
  var SEASON_ORDER = ["Fall", "Winter", "Spring"];
  var SPORT_SEASON = {};   // "Girls Golf Varsity" -> "Fall"
  var SEASON_SPAN = {};    // "Fall" -> { min: "2026-08-12", max: "2026-11-07" }
  DATA.forEach(function (e) {
    var k = sportLabel(e);
    if (!SPORT_SEASON[k]) SPORT_SEASON[k] = e.season;
    var s = SEASON_SPAN[e.season] || (SEASON_SPAN[e.season] = { min: e.date, max: e.date });
    if (e.date < s.min) s.min = e.date;
    var last = e.end || e.date;
    if (last > s.max) s.max = last;
  });

  // With no season tab chosen, order the dropdown by whatever season we are in now.
  function currentSeasonByDate() {
    var iso = localISO(new Date());
    for (var i = 0; i < SEASON_ORDER.length; i++) {
      var s = SEASON_SPAN[SEASON_ORDER[i]];
      if (s && iso >= s.min && iso <= s.max) return SEASON_ORDER[i];
    }
    for (var j = 0; j < SEASON_ORDER.length; j++) {
      var sp = SEASON_SPAN[SEASON_ORDER[j]];
      if (sp && iso < sp.min) return SEASON_ORDER[j];
    }
    return SEASON_ORDER[SEASON_ORDER.length - 1];
  }

  // Sport-levels, sorted so the active (or current) season floats to the top.
  function orderedSportLabels() {
    var pivot = state.season || currentSeasonByDate();
    var rank = {}; rank[pivot] = 0;
    var n = 1;
    SEASON_ORDER.forEach(function (s) { if (!(s in rank)) rank[s] = n++; });
    return Object.keys(SPORT_SEASON).sort(function (a, b) {
      var ra = rank[SPORT_SEASON[a]], rb = rank[SPORT_SEASON[b]];
      if (ra !== rb) return ra - rb;
      return a < b ? -1 : a > b ? 1 : 0;
    });
  }

  var state = { season: "", search: "", sport: "", site: "", upcoming: false };

  var elx = {
    eyebrow: document.getElementById("eyebrow"),
    tabs: document.getElementById("tabs"),
    feature: document.getElementById("feature"),
    search: document.getElementById("f-search"),
    sport: document.getElementById("f-sport"),
    upcoming: document.getElementById("c-upcoming"),
    home: document.getElementById("c-home"),
    away: document.getElementById("c-away"),
    clear: document.getElementById("btn-clear"),
    count: document.getElementById("result-count"),
    results: document.getElementById("results")
  };

  /* ---- sport dropdown, rebuilt whenever the season changes so the order tracks it ---- */
  function fillSportSelect() {
    var keep = state.sport;
    clear(elx.sport);
    elx.sport.appendChild(el("option", { text: "All sports", attrs: { value: "" } }));
    orderedSportLabels().forEach(function (v) {
      elx.sport.appendChild(el("option", { text: v, attrs: { value: v } }));
    });
    elx.sport.value = keep;
  }

  /* ---- read filters from the address bar so a view can be shared ---- */
  (function fromURL() {
    var q = new URLSearchParams(location.search);
    if (q.get("season") != null) state.season = q.get("season");
    if (q.get("sport")) state.sport = q.get("sport");
    if (q.get("site") === "Home" || q.get("site") === "Away") state.site = q.get("site");
    if (q.get("upcoming") === "1") state.upcoming = true;
  })();

  function syncURL() {
    var q = new URLSearchParams();
    if (state.season) q.set("season", state.season);
    if (state.sport) q.set("sport", state.sport);
    if (state.site) q.set("site", state.site);
    if (state.upcoming) q.set("upcoming", "1");
    var s = q.toString();
    history.replaceState(null, "", s ? "?" + s : location.pathname);
  }

  /* ---- filtering ---- */
  function inSeason(e) { return !state.season || e.season === state.season; }

  function matches(e) {
    if (!inSeason(e)) return false;
    if (state.sport && sportLabel(e) !== state.sport) return false;
    if (state.site && e.site !== state.site) return false;
    if (state.upcoming && toDate(e.end || e.date) < today()) return false;
    var q = state.search.trim().toLowerCase();
    if (q) {
      var hay = [e.sport, e.team, e.event, e.venue, e.note, e.kind, e.season]
        .join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function bySeason() { return DATA.filter(inSeason); }

  /* ---- render: season tabs ---- */
  function renderTabs() {
    clear(elx.tabs);
    SEASONS.forEach(function (s) {
      var on = s.key === state.season;
      var b = el("button", {
        text: s.label,
        cls: on ? "tab on" : "tab",
        attrs: { type: "button", role: "tab", "aria-selected": on ? "true" : "false" }
      });
      b.addEventListener("click", function () {
        state.season = s.key;
        setAccent(s.accent, s.soft);
        renderAll();
      });
      elx.tabs.appendChild(b);
    });
  }

  /* ---- render: the next contest ---- */
  function renderFeature() {
    var t = today();
    var next = bySeason()
      .filter(function (e) { return toDate(e.date) >= t; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];

    clear(elx.feature);

    if (!next) {
      elx.feature.appendChild(el("div", { cls: "count", text: "—" },
        el("small", { text: "season complete" })));
      elx.feature.appendChild(el("h2", { text: "Nothing left on the calendar" }));
      return;
    }

    var out = daysBetween(t, toDate(next.date));
    var count = el("div", { cls: "count", text: out <= 0 ? "Today" : String(out) });
    count.appendChild(el("small", {
      text: out <= 0 ? "game day" : (out === 1 ? "day away" : "days away")
    }));
    elx.feature.appendChild(count);

    elx.feature.appendChild(el("h2", {
      text: (next.emoji ? next.emoji + "  " : "") + sportLabel(next) + " " + next.event
    }));

    var meta = [
      fmtLong(next.date),
      next.time,
      next.site === "Home" ? "Home at GMC"
        : next.site + (next.venue ? " at " + next.venue : "")
    ].filter(Boolean).join("  ·  ");
    elx.feature.appendChild(el("p", { cls: "fmeta", text: meta }));
  }

  /* ---- render: one contest as a list item ---- */
  function gameItem(e) {
    var li = el("li");

    var title = el("div", { cls: "g-title",
      text: (e.emoji ? e.emoji + "  " : "") + sportLabel(e) + "  " + e.event });
    title.appendChild(el("span", {
      cls: e.site === "Home" ? "tag" : "tag away",
      text: e.site === "Home" ? "Home" : e.site === "Away" ? "Away" : "Neutral"
    }));
    li.appendChild(title);

    var bits = [];
    if (e.time) bits.push(e.time);
    bits.push(e.venue === "GMC" ? "GMC, home" : (e.venue || ""));
    if (e.end) bits.push("through " + fmtShort(e.end));
    li.appendChild(el("div", { cls: "g-meta", text: bits.filter(Boolean).join("  ·  ") }));

    if (e.note) li.appendChild(el("div", { cls: "g-note", text: "⚠️  " + e.note }));
    return li;
  }

  /* ---- render: the grouped results list ---- */
  function renderResults() {
    var list = DATA.filter(matches).sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return sportLabel(a) < sportLabel(b) ? -1 : 1;
    });

    elx.count.textContent = list.length === 1 ? "1 contest" : list.length + " contests";
    clear(elx.results);

    if (!list.length) {
      elx.results.appendChild(el("div", { cls: "empty" },
        el("strong", { text: "No contests match those filters" }),
        document.createTextNode("Try clearing the date range or picking a different sport.")
      ));
      return;
    }

    var todayISO = localISO(today());

    var groups = {}, order = [];
    list.forEach(function (e) {
      if (!groups[e.date]) { groups[e.date] = []; order.push(e.date); }
      groups[e.date].push(e);
    });

    order.forEach(function (d) {
      var head = el("h3", { cls: "day", text: fmtLong(d) + (d === todayISO ? "  —  Today" : "") });
      elx.results.appendChild(head);
      var ul = el("ul", { cls: "games" });
      groups[d].forEach(function (e) { ul.appendChild(gameItem(e)); });
      elx.results.appendChild(ul);
    });
  }

  function renderAll() {
    elx.eyebrow.textContent = state.season
      ? "Greer Middle College · 2026-27 · " + state.season
      : "Greer Middle College · 2026-27";
    fillSportSelect();
    renderTabs();
    renderFeature();
    renderResults();
    syncURL();
  }

  /* ---- wiring ---- */
  elx.search.value = state.search;
  ["input", "change"].forEach(function (evt) {
    elx.search.addEventListener(evt, function () { state.search = elx.search.value; renderResults(); });
  });
  elx.sport.addEventListener("change", function () { state.sport = elx.sport.value; renderResults(); syncURL(); });

  function paintChip(chip, pressed) { chip.setAttribute("aria-pressed", pressed ? "true" : "false"); }

  elx.upcoming.addEventListener("click", function () {
    state.upcoming = !state.upcoming;
    paintChip(elx.upcoming, state.upcoming);
    renderResults(); syncURL();
  });
  elx.home.addEventListener("click", function () {
    state.site = state.site === "Home" ? "" : "Home";
    paintChip(elx.home, state.site === "Home");
    paintChip(elx.away, false);
    renderResults(); syncURL();
  });
  elx.away.addEventListener("click", function () {
    state.site = state.site === "Away" ? "" : "Away";
    paintChip(elx.away, state.site === "Away");
    paintChip(elx.home, false);
    renderResults(); syncURL();
  });
  elx.clear.addEventListener("click", function () {
    state.search = ""; state.sport = ""; state.site = ""; state.upcoming = false;
    elx.search.value = ""; elx.sport.value = "";
    paintChip(elx.upcoming, false); paintChip(elx.home, false); paintChip(elx.away, false);
    renderResults(); syncURL();
  });

  /* reflect any URL state onto the chips, then draw */
  paintChip(elx.upcoming, state.upcoming);
  paintChip(elx.home, state.site === "Home");
  paintChip(elx.away, state.site === "Away");

  var gen = (window.GMC_ATHLETICS && window.GMC_ATHLETICS.generated) || "";
  document.getElementById("updated-date").textContent = gen
    ? toDate(gen).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })
    : "unknown";

  var start = SEASONS.filter(function (s) { return s.key === state.season; })[0] || SEASONS[0];
  setAccent(start.accent, start.soft);
  renderAll();
})();
</script>
